<style>
:root{
 --forest:#0f2a22;--forest2:#163a2f;--pine:#1f4d3c;--kraft:#ecdcc0;--kraft2:#dcc59d;--bark:#3b2a1a;--ribbon:#d7263d;--gold:#f2b632;--snow:#f6f8f3;
 --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;
 color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:500 16px/1.5 var(--body);color:var(--snow);min-height:100vh;
 background:
  radial-gradient(1200px 500px at 85% -10%,#24614b55,transparent 70%),
  repeating-linear-gradient(90deg,#0000 0 118px,#ffffff06 118px 120px),
  linear-gradient(180deg,var(--forest),#0a1e18)}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}

/* En-tête : une planche de bois avec un ruban en croix */
.hero{position:relative;overflow:hidden;padding:44px 20px 34px;border-bottom:6px solid var(--bark);
 background:
  repeating-linear-gradient(0deg,#0000 0 46px,#0003 46px 48px),
  linear-gradient(180deg,#b97d43,#9c6532)}
.hero::before,.hero::after{content:"";position:absolute;background:var(--ribbon);box-shadow:inset 0 0 0 3px #0000001f}
.hero::before{left:0;right:0;top:50%;height:30px;transform:translateY(-50%) rotate(-3deg);opacity:.9}
.hero::after{display:none}
.hero-in{position:relative;max-width:1180px;margin:auto}
.tagline{display:inline-block;background:var(--bark);color:var(--kraft);padding:5px 14px;border-radius:999px;font-weight:800;font-size:14px}
h1{font:400 clamp(2.4rem,9vw,5rem)/.95 var(--display);margin:14px 0 10px;color:var(--snow);text-shadow:0 4px 0 var(--bark),0 8px 0 #0003;letter-spacing:.5px;max-width:14ch}
.hero p{margin:0;max-width:52ch;color:#fff;font-weight:700;text-shadow:0 2px 0 #0006;background:#3b2a1acc;display:inline-block;padding:8px 14px;border-radius:12px}

/* Barre d'outils collante */
.bar{position:sticky;top:0;z-index:20;background:#0a1e18ee;backdrop-filter:blur(8px);border-bottom:2px solid #ffffff14}
.bar-in{max-width:1180px;margin:auto;padding:12px 20px;display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--snow);color:var(--bark);border-radius:14px;padding:0 14px;border:3px solid var(--bark)}
.search input{flex:1;border:0;background:none;font:700 16px var(--body);color:var(--bark);padding:11px 0;min-width:0;outline:0}
.search:focus-within{border-color:var(--gold)}
.seg{display:flex;border:3px solid var(--bark);border-radius:14px;overflow:hidden;background:var(--bark)}
.seg button{border:0;background:#0000;color:var(--kraft);font:800 14px var(--body);padding:10px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--bark)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:2px solid #ffffff30;background:#ffffff0d;color:var(--snow);font:800 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ribbon);border-color:var(--ribbon)}
.lang button{min-width:44px}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:#bcd2c7;font-size:14px;font-weight:700}
.meta button{border:2px solid #ffffff30;background:none;color:var(--snow);border-radius:10px;padding:5px 10px;font:800 13px var(--body);cursor:pointer}

main{max-width:1180px;margin:auto;padding:8px 20px 60px}
.banner{display:none;align-items:center;gap:14px;margin:16px 0;padding:14px 16px;border-radius:14px;background:#5a2118;border:2px solid var(--ribbon);color:#ffd9d2;font-weight:700}
.wifi{flex:none;width:32px;height:32px}
.wifi *{opacity:.15;animation:wifi 1.8s ease-in-out infinite}
.wifi .w1{animation-delay:.25s}.wifi .w2{animation-delay:.5s}.wifi .w3{animation-delay:.75s}
@keyframes wifi{0%{opacity:.15}25%,75%{opacity:1}100%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.wifi *{animation:none;opacity:1}}
.banner code{background:#0004;padding:1px 6px;border-radius:6px}

/* Titres d'année : un ruban */
.year-head{display:flex;align-items:center;gap:14px;margin:34px 0 14px}
.year-head h2{margin:0;font:400 2rem/1 var(--display);background:var(--ribbon);color:var(--snow);padding:8px 22px 8px 18px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%);text-shadow:0 2px 0 #0004}
.year-head span{color:#bcd2c7;font-weight:800;font-size:14px;white-space:nowrap}
.year-head::after{content:"";flex:1;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--kraft2) 0 10px,#0000 10px 18px);opacity:.35;order:3}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}

/* Cartes : des étiquettes cadeau en papier kraft */
.tag{position:relative;display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center;padding:18px 16px 16px 16px;color:var(--bark);min-height:148px;
 background:linear-gradient(160deg,var(--kraft),var(--kraft2));
 clip-path:polygon(26px 0,100% 0,100% 100%,0 100%,0 26px);filter:none}
.tag::before{content:"";position:absolute;left:5px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--forest);box-shadow:0 0 0 3px #fff8;z-index:2}
.pic{all:unset;box-sizing:border-box;cursor:zoom-in;width:116px;height:116px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;
 background:radial-gradient(circle at 50% 40%,#fff,#f1e6d0 70%);border:3px solid var(--bark)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic.empty{opacity:.5;filter:grayscale(.4)}
.desc{margin:0;font-weight:700;font-size:15px;line-height:1.4}
.desc.none{opacity:.6;font-weight:600}
.pic:focus-visible{outline:3px solid var(--ribbon);outline-offset:2px}
.name{font:400 1.2rem/1.1 var(--display);margin:0 0 6px;overflow-wrap:anywhere}
.yr{display:inline-block;background:var(--bark);color:var(--kraft);font-weight:800;font-size:12px;padding:2px 10px;border-radius:999px}
.links{margin-top:8px}
.wiki{font-weight:800;font-size:13px;color:#8a1426;text-decoration:underline;text-underline-offset:3px}
.status{font-size:12px;color:#6b5638;margin-top:4px;font-weight:700}
.empty-msg{text-align:center;padding:60px 10px;color:#bcd2c7;font-weight:700}

/* Visionneuse */
dialog{border:0;padding:0;background:none;max-width:min(92vw,520px);width:100%;color:var(--bark)}
dialog::backdrop{background:#04120ecc;backdrop-filter:blur(4px)}
.lb{background:linear-gradient(160deg,var(--kraft),var(--kraft2));border-radius:22px;padding:18px;border:4px solid var(--bark);text-align:center}
.lb .big{background:radial-gradient(circle at 50% 40%,#fff,#f1e6d0 70%);border-radius:16px;border:3px solid var(--bark);aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb img{width:100%;height:100%;object-fit:contain}
.lb h3{font:400 1.6rem/1.1 var(--display);margin:14px 0 6px}
.lb .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:3px solid var(--bark);background:var(--gold);color:var(--bark);font:800 15px var(--body);padding:9px 16px;border-radius:12px;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--snow)}

.contents{font-size:13px;font-weight:700;margin-top:6px;line-height:1.35}
.contents b{font-weight:800}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.badge.sure{background:#1f6b3a;color:#fff}.badge.maybe{background:#8a6a1a;color:#fff}
.items{all:unset;box-sizing:border-box;display:block;margin-top:8px;cursor:pointer;width:100%}
.items:focus-visible{outline:3px solid var(--ribbon);outline-offset:3px;border-radius:6px}
.chipw{display:flex;flex-wrap:wrap;gap:6px}
.ichip{background:var(--bark);color:var(--kraft);font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;line-height:1.3}
.tap{font-size:12px;font-weight:800;color:#8a1426;margin-top:5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:14px;max-height:58vh;overflow:auto;padding:2px}
.cell{text-align:center}
.cpic{aspect-ratio:1;border-radius:14px;border:3px solid var(--bark);background:radial-gradient(circle at 50% 40%,#fff,#f1e6d0 70%);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.cpic img{width:100%;height:100%;object-fit:contain;display:block}
.cpic.empty{opacity:.5}
.cname{font-weight:800;font-size:13px;margin-top:5px;line-height:1.2;overflow-wrap:anywhere}
.cname a{color:var(--bark);text-underline-offset:3px}
.it{border-left:4px solid var(--ribbon);padding-left:9px}
.where{font-size:12px;font-weight:700;color:#6b5638;line-height:1.25}
.iname{font-weight:800;font-size:15px;line-height:1.2}
.more{font-size:12px;font-weight:700;color:#6b5638}
.origin{font-size:12px;font-weight:700;margin-top:4px;color:#6b5638}
.origin a{color:#8a1426;font-weight:800;text-underline-offset:3px}
footer{max-width:1180px;margin:auto;padding:0 20px 40px;color:#8fb1a1;font-size:13px;font-weight:600}

@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding-top:34px}.tag{grid-template-columns:104px 1fr}.pic{width:104px;height:104px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* Une seule animation : l'apparition de l'image qui vient de charger */
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pic img{animation:pop .35s ease-out}
@media(prefers-reduced-motion:reduce){.pic img{animation:none}}

/* ===== Finitions ===== */
body{background:
 radial-gradient(circle,#ffffff18 1.2px,#0000 1.8px) 0 0/54px 54px,
 radial-gradient(circle,#ffffff10 1px,#0000 1.6px) 27px 27px/54px 54px,
 radial-gradient(1200px 500px at 85% -10%,#24614b66,#0000 70%),
 linear-gradient(180deg,var(--forest),#08180f)}
.hero{border-bottom:0;padding:48px 20px 70px;background:
 repeating-linear-gradient(0deg,#0000 0 46px,#0002 46px 48px),
 repeating-linear-gradient(90deg,#0000 0 160px,#0000001a 160px 162px),
 linear-gradient(180deg,#c48a4e,#9c6532)}
.hero::before{height:34px;opacity:1;background:repeating-linear-gradient(90deg,var(--ribbon) 0 70px,#e8374d 70px 140px)}
.hero::after{content:"";display:block;position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(circle,#fff 1.6px,#0000 2.2px) 0 0/70px 70px,radial-gradient(circle,#fffc 1.2px,#0000 1.8px) 35px 35px/70px 70px;opacity:.55;animation:snow 14s linear infinite}
@keyframes snow{to{background-position:-20px 70px,15px 105px}}
.hero-in{z-index:1;display:flex;align-items:center;justify-content:space-between;gap:18px}
.stack{flex:none;width:clamp(112px,27vw,250px);height:auto;filter:drop-shadow(0 8px 0 #0004);transform:rotate(4deg)}
h1{font-size:clamp(2.3rem,8.5vw,4.8rem)}
.pines{height:42px;margin-top:-41px;position:relative;z-index:2;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='42' viewBox='0 0 44 42'><polygon points='0,42 22,2 44,42' fill='%230f2a22'/><polygon points='9,42 22,14 35,42' fill='%23163a2f'/></svg>") repeat-x bottom/44px 42px}
.bar{border-bottom:0;box-shadow:0 8px 18px #0006}
.bar::after{content:"";display:block;height:7px;background:repeating-linear-gradient(135deg,var(--ribbon) 0 12px,var(--snow) 12px 24px)}
.chip{transition:background .15s,transform .15s}
.chip[aria-pressed="true"]{background:var(--ribbon);border-color:#ff8a98;box-shadow:0 3px 0 #7a1020}
.seg button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 #b8861b}
.year-head h2{font-size:2.3rem;padding:10px 28px 10px 20px;box-shadow:0 4px 0 #7a1020}
.grid{filter:drop-shadow(0 6px 0 #0000004d)}
.tag{background:
 repeating-linear-gradient(0deg,#0000 0 3px,#8a5a2a0d 3px 4px),
 linear-gradient(160deg,#f3e6cb,#dcc59d);
 transition:transform .18s ease}
.tag:hover{transform:translateY(-4px) rotate(-.6deg)}
.pic{box-shadow:inset 0 3px 8px #3b2a1a33,0 3px 0 #3b2a1a;transition:transform .18s}
.pic:hover{transform:scale(1.04) rotate(2deg)}
.name{font-size:1.3rem;color:#2c1d0e}
.desc{color:#4b3a26;font-weight:700}
.pic.empty:hover{transform:none}
dialog .lb{box-shadow:0 12px 0 #0005,0 0 0 6px #d7263d}
@media(prefers-reduced-motion:reduce){.hero::after{animation:none}.tag,.pic{transition:none}.tag:hover,.pic:hover{transform:none}}
@media(max-width:520px){.hero{padding:34px 16px 64px}.stack{width:104px}}

/* ===== Encore plus beau ===== */
.tag{--yc:#c0834a}
.tag::after{content:"";position:absolute;left:26px;right:0;top:0;height:7px;background:var(--yc);box-shadow:inset 0 -2px 0 #0003}
.pic{background:radial-gradient(circle at 50% 38%,#fff 0,color-mix(in srgb,var(--yc) 24%,#f6ecd8) 78%)}
.name{text-wrap:balance}.desc{text-wrap:pretty}
.year-head h2{border-left:14px solid var(--yc,#fff);padding-left:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;box-shadow:0 0 0 2px #0006}
.chips{-webkit-mask-image:linear-gradient(90deg,#000 90%,#0000);mask-image:linear-gradient(90deg,#000 90%,#0000);padding-right:24px}

.search:focus-within{box-shadow:0 4px 0 #0005,0 0 0 5px #f2b63255}
.hero h1{background:linear-gradient(180deg,#fff 40%,#ffe7b0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 4px 0 var(--bark)) drop-shadow(0 8px 0 #0003);text-shadow:none}
.tagline{box-shadow:0 3px 0 #0005;border:2px solid #f2b63266}
.hero p{border:2px solid #f2b63244}
dialog[open] .lb{animation:pop .25s ease-out}
dialog[open]::backdrop{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:52px;height:52px;border-radius:50%;border:3px solid var(--bark);background:var(--gold);font-size:24px;cursor:pointer;box-shadow:0 5px 0 var(--bark);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:opacity .2s,transform .2s}
#top.show{opacity:1;transform:none;pointer-events:auto}
#top:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bark)}
footer{margin-top:10px;padding-top:26px;text-align:center;border-top:4px dashed #ecdcc033;font-weight:700}
footer::before{content:"🎄 🎁 🎄";display:block;font-size:22px;margin-bottom:6px;letter-spacing:6px}
@media(prefers-reduced-motion:reduce){dialog[open] .lb,dialog[open]::backdrop{animation:none}#top{transition:none}}

/* ===== Favoris, navigation, chargement ===== */
.fav{position:absolute;right:10px;top:16px;z-index:3;width:36px;height:36px;border-radius:50%;border:2px solid var(--bark);background:#fff9;color:var(--bark);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px;transition:transform .15s}
.fav:active{transform:scale(.88)}
.fav.on{background:var(--ribbon);color:#fff;border-color:#7a1020}
.tag .name{padding-right:36px}
.mbtn{display:flex;gap:8px;flex-wrap:wrap}
.big{position:relative}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:3px solid var(--bark);background:#f2b632ee;font:800 28px/1 var(--body);color:var(--bark);cursor:pointer;display:grid;place-items:center;padding:0 0 4px}
.nav.prev{left:8px}.nav.next{right:8px}
@keyframes shim{to{background-position:-200% 0}}
body:not(.imgdone) .pic.empty{background:linear-gradient(100deg,#f1e6d0 30%,#fff 50%,#f1e6d0 70%) 0 0/200% 100%;animation:shim 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){body:not(.imgdone) .pic.empty{animation:none}.fav{transition:none}}

/* ===== Collection, liste, frise, partage ===== */
.own,.ownb{font:800 13px var(--body);cursor:pointer}
.own{display:inline-flex;align-items:center;gap:7px;margin-top:8px;border:2px solid var(--bark);background:#fff9;color:var(--bark);border-radius:999px;padding:3px 12px 3px 4px}
.own .box,.ownb .box{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--bark);display:grid;place-items:center;font-size:13px;line-height:1;background:#fff;color:#1f6b3a}
.own[aria-pressed="true"]{background:#1f6b3a;color:#fff;border-color:#0f3a1f}

.ownb{display:inline-flex;align-items:center;gap:8px}
.ownb[aria-pressed="true"]{background:#1f6b3a;color:#fff}

.dash-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.tlc{flex:1 1 0;min-width:0;border:0;background:none;color:var(--bark);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 12px var(--body);padding:5px 2px 4px;border-radius:10px}
.tlc[aria-pressed="true"]{background:#3b2a1a1f;box-shadow:inset 0 0 0 2px var(--bark)}
.tlbar{display:block;width:100%;max-width:36px;border:2px solid var(--bark);border-radius:6px 6px 0 0;background:var(--yc);position:relative;overflow:hidden}

 background:var(--bark);color:var(--kraft);padding:10px 16px;border-radius:999px;font:800 14px var(--body);z-index:60}

/* Vue liste compacte */
.view-list .grid{grid-template-columns:1fr;gap:8px}
.view-list .tag{grid-template-columns:52px 1fr;gap:12px;min-height:0;padding:14px 104px 10px 12px}

const thumbs=new Map(),tried=new Set(),live=new Map();
let apiOk=null,busy=false;
async function j(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

function paint(name,url){
 (live.get(name)||[]).forEach(el=>{
  el.img.onerror=()=>{if(!el.img.dataset.r){el.img.dataset.r='1';setTimeout(()=>{el.img.src=url+(url.includes('?')?'&':'?')+'r='+Date.now()},1500);return}el.img.remove();el.pic.classList.add('empty');el.pic.textContent='🎁';el.status.textContent=t('imgFail')};
  el.img.src=url;
  if(!el.pic.contains(el.img))el.pic.replaceChildren(el.img);
  el.pic.classList.remove('empty');el.status.textContent=t('imgWiki');
 });
}
function setImage(name,url){thumbs.set(norm(name),url);paint(name,url);

async function loadBatch(){
 const names=gifts.map(g=>g.name);
 for(let i=0;i<names.length;i+=40){
  const chunk=names.slice(i,i+40);
  const d=await j(API+'&prop=pageimages&piprop=thumbnail&pilimit=50&pithumbsize=320&titles='+encodeURIComponent(chunk.map(slug).join('|')));
  apiOk=true;const q=d.query||{};
  const map={};chunk.forEach(n=>map[norm(n)]=norm(n));
  for(const list of [q.normalized||[],q.redirects||[]])for(const e of list)for(const k in map)if(map[k]===norm(e.from))map[k]=norm(e.to);
  const byTitle={};Object.values(q.pages||{}).forEach(p=>{if(p.thumbnail?.source)byTitle[norm(p.title)]=p.thumbnail.source});
  chunk.forEach(n=>{if(byTitle[map[norm(n)]])setImage(n,byTitle[map[norm(n)]])});
 }
}
const BAD=/(logo|icon|wiki|favicon|button|arrow|stub|badge|avatar|robux|coin|star|infobox|template)/i;
async function findInPage(name){
 const d=await j(API+'&generator=images&gimlimit=40&prop=imageinfo&iiprop=url|size&iiurlwidth=320&titles='+encodeURIComponent(slug(name)));
 const words=norm(name).split(' ').filter(w=>w.length>3&&!['gift','from','with'].includes(w));
 const cands=Object.values(d.query?.pages||{}).filter(p=>p.imageinfo?.[0]&&/\.(png|jpe?g|webp|gif)$/i.test(p.title)&&!BAD.test(p.title)).map(p=>{
  const ii=p.imageinfo[0],t=p.title.toLowerCase();
  let s=Math.min((ii.width||0)*(ii.height||0),1e6)/1e6;
  if(/gift|present|box/.test(t))s+=2;
  words.forEach(w=>{if(t.includes(w))s+=1});
  return {s,url:ii.thumburl||ii.url};
 }).sort((a,b)=>b.s-a.s);
 return cands[0]?.url||null;
}
async function loadDetails(){
 const todo=gifts.map(g=>g.name).filter(n=>!fixedImages[n]&&!thumbs.has(norm(n))&&!tried.has(n));
 let i=0;
 const worker=async()=>{while(i<todo.length){const n=todo[i++];tried.add(n);
  try{const u=await findInPage(n);if(u)setImage(n,u);else{(live.get(n)||[]).forEach(el=>el.status.textContent=t('imgNone'))}}catch(e){}}};
 await Promise.all([worker(),worker(),worker(),worker()]);
}
async function loadAll(){

/* ---------- Contenu des gifts (lu sur le wiki) ---------- */
const contents=new Map();      // nom du gift -> {items:[...], from:'section'|'page'}
const seedContents={'Fiery Gift of Lumber':['Fire Axe']};
const giftNames=new Set(gifts.map(g=>norm(g.name)));
const NS=/^(file|image|category|template|special|user|talk|help|wikipedia|w|c|fandom|mediawiki):/i;
const STOP=/^(gifts?|christmas|defaultio|roblox|lumber tycoon 2|bob|santa|axes?|wood|items?|tools?|updates?|events?|lumberland|robux|money|plots?|land|trading|trade|game|players?|christmas event|loose items|placeables|vehicles|structures|stores?|trees?)$/i;
const cleanTxt=t=>t.replace(/<[^>]*>/g,'').replace(/\{\{[^}]*\}\}/g,'').replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g,(m,a,b)=>b||a).replace(/'{2,}/g,'').trim();
function okItem(n){const t=n.trim();return t.length>1&&t.length<45&&!NS.test(t)&&!STOP.test(t)&&!/^\d{4}$/.test(t)&&!/gift/i.test(t)&&!giftNames.has(norm(t))}
function linksOf(txt){const out=[];const re=/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g;let m;while((m=re.exec(txt)))if(okItem(m[1]))out.push(m[1].trim());return out}
function bulletsOf(txt){const out=[];const re=/^[*#]+\s*(.+)$/gm;let m;while((m=re.exec(txt))){let t=cleanTxt(m[1]).split(/\s[-–—:(]\s?|\(/)[0].trim();if(okItem(t))out.push(t)}return out}
function parseItems(wt){
 const parts=wt.split(/^(={2,4})[ \t]*(.+?)[ \t]*\1[ \t]*$/gm);
 const want=/content|contain|item|loot|reward|drop|obtain|inside|prize|possible|unbox|open|receiv/i;
 let found=[];
 for(let i=1;i+2<parts.length;i+=3){
  if(want.test(cleanTxt(parts[i+1]))){found=found.concat(linksOf(parts[i+2]),bulletsOf(parts[i+2]))}
 }
 let from='section';
 if(!found.length){from='page';found=linksOf(wt)}
 const seen=new Set(),items=[];
 found.forEach(n=>{const k=norm(n);if(!seen.has(k)){seen.add(k);items.push(n)}});
 return {items,from};
}
const descs=new Map();   // nom du gift -> description
function parseDesc(wt){
 const m=/^[ \t]*\|[ \t]*(description|desc|quote|flavou?r(?:text)?|tagline|blurb|text)[ \t]*=[ \t]*(.+)$/im.exec(wt);
 if(m){const t=cleanTxt(m[2]);if(t.length>3)return t}
 let t=wt;for(let k=0;k<6;k++)t=t.replace(/\{\{[^{}]*\}\}/g,'');
 const line=t.replace(/\[\[(?:File|Image|Category)[^\]]*\]\]/gi,'').split('\n').map(l=>l.trim()).find(l=>l&&!/^[=*#|!{}:;<_]/.test(l));
 if(!line)return '';
 const c=cleanTxt(line),sent=c.match(/^.{20,220}?[.!?](\s|$)/);
 return (sent?sent[0]:c.slice(0,200)).trim();
}
function titleMap(chunk,q){
 const map={};chunk.forEach(n=>map[norm(n)]=norm(n));
 for(const list of [q.normalized||[],q.redirects||[]])for(const e of list)for(const k in map)if(map[k]===norm(e.from))map[k]=norm(e.to);
 return map;
}
async function loadContents(){
 if(cState==='loading')return;cState='loading';cDone=0;contents.clear();descs.clear();
 for(const g in seedContents)contents.set(g,{items:seedContents[g],from:'section'});
 updCstat();
 try{
  const names=gifts.map(g=>g.name);
  for(let i=0;i<names.length;i+=20){
   const chunk=names.slice(i,i+20);
   const d=await j(API+'&formatversion=2&prop=revisions&rvprop=content&rvslots=main&titles='+encodeURIComponent(chunk.map(slug).join('|')));
   const q=d.query||{},map=titleMap(chunk,q),byTitle={};
   (q.pages||[]).forEach(p=>{const c=p.revisions?.[0]?.slots?.main?.content;if(c)byTitle[norm(p.title)]=c});
   chunk.forEach(n=>{
    const wt=byTitle[map[norm(n)]];
    if(wt){descs.set(n,parseDesc(wt));const r=parseItems(wt);const seed=seedContents[n]||[];
     const items=[...new Set([...seed,...r.items])];
     if(items.length)contents.set(n,{items,from:seed.length?'section':r.from})}
   });
   cDone=Math.min(names.length,i+20);updCstat();
   render();
  }
  cState='done';updCstat();render();
 }catch(e){
  console.warn(e);cState='error';updCstat();
  showBanner('bannerCt',e.message);
 }
 render();
}

  b.onclick=()=>{yearFilter=v;buildChips();render()};chips.append(b);

}

  const buf=await f.arrayBuffer(),u=new Uint8Array(buf);let d;
  if(u[0]===0x25&&u[1]===0x50&&u[2]===0x44&&u[3]===0x46){
   const m=new TextDecoder('latin1').decode(u).match(/LT2GIFTS-DATA:([\s\S]*?):END-LT2GIFTS/);
   if(!m)throw new Error('bad');d=JSON.parse(m[1]);
  }else d=JSON.parse(new TextDecoder().decode(u));
  if(!d||d.app!=='lt2-gifts'||!Array.isArray(d.favs)||!Array.isArray(d.owned))throw new Error('bad');
  pendingBk={favs:cleanList(d.favs),owned:cleanList(d.owned)};

function updAccBtn(){
 const ab=$('accBtn');ab.textContent=fbUser?at('btnIn',accName(fbUser)):at('btn');
 if(fbUser&&isAdm){const b=document.createElement('span');b.className='adm-badge';b.textContent='👑 ADMIN';b.title='Outils admin';b.onclick=e=>{e.stopPropagation();openAdm()};ab.append(' ',b)}

 const c=isAdm?unread:myNew;
 if(c>0){const k=document.createElement('span');k.className='cnt-badge';k.textContent=c>99?'99+':String(c);sb.append(k)}
 $('stBtn').textContent=at('stBtn');

function renderAcc(){
 const m=fbUser?'in':accMode,on=cloudOn();
 $('accTitle').textContent=at('title');
 $('accText').textContent=!on?at('off'):m==='in'?at('textIn',accName(fbUser)):m==='reset'?at('textReset'):(accReason||at('textOut'));
 $('accForm').hidden=!on||m==='in';$('accOut').hidden=m!=='in';
 $('accPseudo').hidden=m!=='signup';$('accPass').hidden=m==='reset';
 $('accPseudo').placeholder=at('pseudo');$('accEmail').placeholder=at('email');$('accPass').placeholder=at('pass');
 $('accPass').autocomplete=m==='signup'?'new-password':'current-password';
 $('accGo').textContent=m==='signup'?at('signup'):m==='reset'?at('sendReset'):at('login');
 $('accForgot').hidden=m!=='login';$('accForgot').textContent=at('forgot');
 $('accSwitch').textContent=m==='login'?at('goSignup'):m==='signup'?at('goLogin'):at('back');
 $('accLogout').textContent=at('logout');$('accAdm').hidden=!isAdm;$('accAdm').textContent=at('admBtn');$('accImp').textContent=at('imp');
 $('accStayT').textContent=at('stay');$('accStayL').hidden=m!=='login'&&m!=='signup';
}
async function loadFb(){
 if(fb)return true;if(!cloudOn())return false;
 try{
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);
  fb={auth:Au.getAuth(app),db:Fs.getFirestore(app),m:{...Au,...Fs}};
  Au.onAuthStateChanged(fb.auth,onUser);
  return true;
 }catch(e){return false}
}
async function pushNow(){
 if(!fbUser||!fb)return;
 try{await fb.m.setDoc(fb.m.doc(fb.db,'users',fbUser.uid),{pseudo:fbUser.displayName||'',email:fbUser.email||'',favs:[...favs],owned:[...owned],goal:goal||0,updated:Date.now()})}catch(e){}
}
async function ensureUsername(u){
 const n=u&&u.displayName;if(!n||!fb||!/^[A-Za-z0-9_.-]{3,20}$/.test(n))return;
 const r=fb.m.doc(fb.db,'usernames',n.toLowerCase());
 try{const sn=await fb.m.getDoc(r);if(!sn.exists())await fb.m.setDoc(r,{uid:u.uid})}catch(e){}
}
async function onUser(u){
 fbUser=u;authKnown=true;if(!u)isAdm=false;updAccBtn();if(accDlg.open)renderAcc();if($('sug').open)renderSug();
 if(u&&await checkBan(u))return;
 if(u){checkAdmin();ensureUsername(u);loadMine();checkWarnings(u)}
 if(!u){resetInbox();cloudPush=()=>{};try{localStorage.removeItem('lt2uid')}catch(e){}return}
 try{
  const snap=await fb.m.getDoc(fb.m.doc(fb.db,'users',u.uid));
  let last='';try{last=localStorage.getItem('lt2uid')||''}catch(e){}
  if(snap.exists()){
   const d=snap.data(),cf=cleanList(d.favs||[]),co=cleanList(d.owned||[]);
   if(last===u.uid){favs=new Set(cf);owned=new Set(co)}
   else{cf.forEach(x=>favs.add(x));co.forEach(x=>owned.add(x))}
   saveFavs();saveOwned();render();syncLb();
   if(typeof d.goal==='number'&&d.goal>0){goal=d.goal;try{localStorage.setItem('lt2goal',String(goal))}catch(e){}}
  }
  try{localStorage.setItem('lt2uid',u.uid)}catch(e){}
  cloudPush=()=>{clearTimeout(pushT);pushT=setTimeout(pushNow,800)};
  if(!snap.exists()||last!==u.uid||!snap.data().email)pushNow();
 }catch(e){}
}
function openAcc(reason){accReason=reason||'';accMode='login';accMsg('');renderAcc();if(!accDlg.open)accDlg.showModal();if(cloudOn()&&!fb)loadFb()}
function needAuth(r){
 if(!cloudOn()||fbUser)return false;
 let hint='';try{hint=localStorage.getItem('lt2uid')||''}catch(e){}
 if(!authKnown&&hint)return false;
 openAcc(r||at('promptFav'));return true;
}
$('accBtn').onclick=()=>openAcc('');
$('accImp').onclick=()=>{accDlg.close();openBk()};
$('accClose').onclick=()=>accDlg.close();
accDlg.addEventListener('click',e=>{if(e.target===accDlg)accDlg.close()});
$('accForgot').onclick=()=>{accMode='reset';accMsg('');renderAcc()};
$('accSwitch').onclick=()=>{accMode=accMode==='login'?'signup':'login';accMsg('');renderAcc()};
$('accLogout').onclick=async()=>{try{await fb.m.signOut(fb.auth);accMode='login';accMsg(at('loggedOut'));renderAcc()}catch(e){accMsg(at('e').def)}};
['accEmail','accPass','accPseudo'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('accGo').click()}));
$('accGo').onclick=async()=>{
 if(!cloudOn())return;
 const email=$('accEmail').value.trim(),pass=$('accPass').value,pseudo=$('accPseudo').value.trim();
 accMsg('');
 if(!email){accMsg(at('needEmail'));return}
 if(accMode!=='reset'&&!pass){accMsg(at('needPass'));return}
 if(accMode==='signup'&&!/^[A-Za-z0-9_.-]{3,20}$/.test(pseudo)){accMsg(at('badPseudo'));return}
 if(!fb){accMsg(at('loading'));if(!await loadFb()){accMsg(at('offline'));return}accMsg('')}
 $('accGo').disabled=true;
 try{
  const M=fb.m;fb.auth.languageCode=lang==='en'?'en':'fr';
  if(accMode!=='reset')await M.setPersistence(fb.auth,$('accStay').checked?M.browserLocalPersistence:M.browserSessionPersistence);
  if(accMode==='signup'){
   if(await isEmailBanned(email)){accMsg(at('emailBanned'));return}
   const key=pseudo.toLowerCase();
   const ex=await M.getDoc(M.doc(fb.db,'usernames',key));
   if(ex.exists()){accMsg(at('pseudoTaken'));return}
   const c=await M.createUserWithEmailAndPassword(fb.auth,email,pass);
   try{await M.setDoc(M.doc(fb.db,'usernames',key),{uid:c.user.uid})}
   catch(err){try{await c.user.delete()}catch(_){}accMsg(err&&err.code==='permission-denied'?at('pseudoTaken'):at('e').def);return}
   await M.updateProfile(c.user,{displayName:pseudo});
   fbUser=c.user;updAccBtn();renderAcc();pushNow();toastMsg(at('created'));
  }else if(accMode==='login'){
   if(await isEmailBanned(email)){accMsg(at('emailBanned'));return}
   await M.signInWithEmailAndPassword(fb.auth,email,pass);
   $('accPass').value='';accDlg.close();toastMsg(at('logged'));
  }else{
   await M.sendPasswordResetEmail(fb.auth,email);accMsg(at('resetSent'));
  }
 }catch(e){const E=at('e');accMsg(E[e&&e.code]||E.def)}
 finally{$('accGo').disabled=false}
};

const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const sugDlg=$('sug'),sugMsg=m=>{$('sugMsg').textContent=m||''};
let lastSug=0,unsubInbox=null,inboxDocs=[],unread=0,freshIds=new Set(),marking=false,myDocs=[],myNew=0,newReplyIds=new Set();
const drafts=new Map(),ST_KEYS=['new','progress','done'];
const stLabel=s=>at('st_'+(ST_KEYS.includes(s)?s:'new'));
const fmtDate=ms=>new Date(ms||0).toLocaleString(lang==='en'?'en-US':'fr-FR',{dateStyle:'short',timeStyle:'short'});
const seenKey=()=>'lt2seen_'+(fbUser?fbUser.uid:'');
function checkAdmin(){
 if(unsubInbox||!fb||!fbUser)return;
 const M=fb.m;
 unsubInbox=M.onSnapshot(M.query(M.collection(fb.db,'suggestions'),M.orderBy('created','desc'),M.limit(100)),snap=>{
  isAdm=true;inboxDocs=snap.docs;unread=inboxDocs.filter(d=>d.data().read!==true).length;
  updAccBtn();if(accDlg.open)renderAcc();if(sugDlg.open)renderSug();
 },()=>{unsubInbox=null;isAdm=false;inboxDocs=[];unread=0;updAccBtn()});
}
function resetInbox(){if(unsubInbox){unsubInbox();unsubInbox=null}isAdm=false;inboxDocs=[];unread=0;myDocs=[];myNew=0;newReplyIds=new Set()}
async function loadMine(){
 if(!fb||!fbUser)return;
 try{
  const M=fb.m,snap=await M.getDocs(M.query(M.collection(fb.db,'suggestions'),M.where('uid','==',fbUser.uid)));
  myDocs=snap.docs.sort((a,b)=>(b.data().created||0)-(a.data().created||0));
  let seen=0;try{seen=+(localStorage.getItem(seenKey())||0)}catch(e){}
  const nw=myDocs.filter(d=>{const x=d.data();return x.reply&&(x.repliedAt||0)>seen});
  newReplyIds=new Set(nw.map(d=>d.id));myNew=nw.length;
  updAccBtn();if(sugDlg.open)renderMine();
 }catch(e){}
}
function markSeen(){
 if(!fbUser||!sugDlg.open)return;
 try{localStorage.setItem(seenKey(),String(Date.now()))}catch(e){}
 myNew=0;updAccBtn();
}
function renderMine(){
 const L=$('sugMine');L.textContent='';
 if(!myDocs.length){L.textContent=at('mineEmpty');return}
 myDocs.forEach(d=>{
  const x=d.data(),it=mk('div','sug-item'),h=mk('div','sug-head');
  h.append(mk('span','st-pill st-'+(ST_KEYS.includes(x.status)?x.status:'new'),stLabel(x.status)),mk('span','sug-date',fmtDate(x.created)));
  it.append(h,mk('div','sug-body',x.text||''));
  if(x.reply){
   const r=mk('div','sug-reply'),t1=mk('b','',at('replyFrom'));
   if(newReplyIds.has(d.id))t1.append(' ',mk('span','sug-new',at('newTag')));
   r.append(t1,mk('div','sug-body',x.reply));it.append(r);
  }
  L.append(it);
 });
}
async function upd(d,patch){try{await fb.m.updateDoc(d.ref,patch)}catch(e){sugMsg(at('sugFail'))}}
async function markRead(){
 if(marking||!isAdm||!sugDlg.open)return;
 const todo=inboxDocs.filter(d=>d.data().read!==true);if(!todo.length)return;
 marking=true;
 try{const b=fb.m.writeBatch(fb.db);todo.slice(0,400).forEach(d=>b.update(d.ref,{read:true,status:d.data().status||'new'}));await b.commit()}catch(e){}
 marking=false;
}
function renderInbox(){
 const L=$('sugList');L.textContent='';
 inboxDocs.forEach(d=>{if(d.data().read!==true)freshIds.add(d.id)});
 sugMsg(inboxDocs.length?at('inboxN',inboxDocs.length)+(freshIds.size?' · '+at('unreadN',freshIds.size):''):'');
 if(!inboxDocs.length){L.textContent=at('inboxEmpty');return}
 inboxDocs.forEach(d=>{
  const x=d.data(),fresh=freshIds.has(d.id),it=mk('div','sug-item'+(fresh?' fresh':'')),h=mk('div','sug-head');
  h.append(mk('span','sug-name','👤 '+(x.pseudo||'—')),mk('span','sug-mail','✉ '+(x.email||'')));
  if(fresh)h.append(mk('span','sug-new',at('newTag')));
  h.append(mk('span','sug-date',fmtDate(x.created)));
  const sel=mk('select','sug-sel');
  ST_KEYS.forEach(k=>{const o=mk('option','',at('st_'+k));o.value=k;sel.append(o)});
  sel.value=ST_KEYS.includes(x.status)?x.status:'new';
  sel.onchange=()=>upd(d,{status:sel.value});
  const ta=mk('textarea','acc-in sug-reply-ta');ta.rows=2;ta.maxLength=1000;ta.placeholder=at('replyPh');
  ta.value=drafts.has(d.id)?drafts.get(d.id):(x.reply||'');
  ta.oninput=()=>drafts.set(d.id,ta.value);
  const rb=mk('button','btn sug-rbtn',at('replyBtn'));rb.type='button';
  rb.onclick=async()=>{
   const txt=ta.value.trim();
   await upd(d,{reply:txt,repliedAt:Date.now(),status:(sel.value==='new'&&txt)?'progress':sel.value});
   drafts.delete(d.id);
  };
  const del=mk('button','linkb',at('del'));del.type='button';
  del.onclick=async()=>{if(!confirm(at('delAsk')))return;try{await fb.m.deleteDoc(d.ref)}catch(e){sugMsg(at('sugFail'))}};
  const row=mk('div','sug-row');row.append(mk('span','sug-lbl',at('stLbl')),sel);
  it.append(h,mk('div','sug-body',x.text||''),row,ta,rb,del);
  L.append(it);
 });
 markRead();
}

function confetti(n){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const c=document.createElement('canvas'),d=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
 c.width=W*d;c.height=H*d;c.setAttribute('popover','manual');
 c.style.cssText='position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;overflow:hidden;pointer-events:none';
 document.body.append(c);try{c.showPopover()}catch(e){c.style.zIndex='99999'}
 const g=c.getContext('2d');g.scale(d,d);
 const cols=['#f2b632','#d7263d','#1f8f5a','#38bdf8','#a855f7','#fb7185','#ffffff'];
 const P=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.38,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:5+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[(Math.random()*cols.length)|0]}));
 const t0=performance.now();
 (function f(t){
  const e=t-t0;g.clearRect(0,0,W,H);
  P.forEach(p=>{p.vy+=.32;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,1-e/3200);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);g.restore()});
  if(e<3200)requestAnimationFrame(f);else c.remove();
 })(t0);
}

 BADGES.filter(b=>b.id!=='all'&&now.b.has(b.id)&&!was.b.has(b.id)).forEach(b=>msgs.push(at('celBadge',bTxt(b)[0])));
 if(!msgs.length)return;
 confetti(big?200:110);
 msgs.forEach((m,i)=>setTimeout(()=>toastMsg(m),i*2100));
}

 setFav();fav.onclick=e=>{e.stopPropagation();if(needAuth())return;const was=achSnap();favs.has(g.name)?favs.delete(g.name):favs.add(g.name);saveFavs();setFav();if(yearFilter==='fav')render();afterChange(was)};
 card.append(fav);

 if(!live.has(g.name))live.set(g.name,[]);live.get(g.name).push({img,pic,status});
 pic.onclick=()=>openLb(g,pic.classList.contains('empty')?'':img.src);
 const known=fixedImages[g.name]||thumbs.get(norm(g.name));if(known)paint(g.name,known),thumbs.set(norm(g.name),known);
 const info=document.createElement('div');
 const d=document.createElement('p');d.className='desc';
 if(descs.has(g.name)&&descs.get(g.name))d.textContent=descs.get(g.name);
 else if(descs.has(g.name)||cState==='done'||cState==='error'){d.textContent=t('descNone');d.classList.add('none')}
 else{d.textContent=t('descLoad');d.classList.add('none')}
 const nm=document.createElement('h3');nm.className='name';nm.textContent=g.name;
 d.style.marginTop='4px';
 info.append(nm,d);
 const hits=itemHitsOf(g,q);
 if(hits.length){const h=document.createElement('p');h.className='hit';h.textContent=t('contains')+' : '+hits.slice(0,3).join(', ')+(hits.length>3?'…':'');info.append(h)}

/* ---------- Contenu d'un gift en images ---------- */
const itemImgs=new Map();   // objet normalisé -> url ('' si aucune)
async function loadItemImages(items,onImg){
 const need=items.filter(n=>!itemImgs.has(norm(n)));
 items.forEach(n=>{if(itemImgs.get(norm(n)))onImg(n,itemImgs.get(norm(n)))});
 try{
  for(let i=0;i<need.length;i+=40){
   const chunk=need.slice(i,i+40);
   const d=await j(API+'&prop=pageimages&piprop=thumbnail&pilimit=50&pithumbsize=240&titles='+encodeURIComponent(chunk.map(slug).join('|')));
   const q=d.query||{},map=titleMap(chunk,q),byTitle={};
   Object.values(q.pages||{}).forEach(p=>{if(p.thumbnail?.source)byTitle[norm(p.title)]=p.thumbnail.source});
   chunk.forEach(n=>{const u=byTitle[map[norm(n)]];if(u){itemImgs.set(norm(n),u);onImg(n,u)}});
  }
 }catch(e){console.warn(e)}
 const rest=need.filter(n=>!itemImgs.get(norm(n)));let k=0;
 const worker=async()=>{while(k<rest.length){const n=rest[k++];try{const u=await findInPage(n);itemImgs.set(norm(n),u||'');if(u)onImg(n,u)}catch(e){itemImgs.set(norm(n),'')}}};
 await Promise.all([worker(),worker(),worker()]);
}
